name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q Jarvis-Android.zip
      - run: gradle :app:assembleDebug
        working-directory: Jarvis
      - run: gh release create v${{ github.run_number }} Jarvis/app/build/outputs/apk/debug/app-debug.apk --title "Jarvis ${{ github.run_number }}" --notes "Jarvis"
        env:
          GH_TOKEN: ${{ github.token }}
